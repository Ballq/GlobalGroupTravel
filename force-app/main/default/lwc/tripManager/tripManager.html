<template>
    <lightning-card title="Gestion des voyages" icon-name="standard:travel_mode">

    <div class="slds-p-horizontal_medium slds-p-bottom_medium">

        <lightning-button
            label="Actualiser"
            icon-name="utility:refresh"
            onclick={handleRefresh}>
        </lightning-button>

    </div>

    <template if:true={trips}>

        <lightning-datatable
            key-field="Id"
            data={trips}
            columns={columns}
            hide-checkbox-column>
        </lightning-datatable>

    </template>

    <template if:true={error}>
        <div class="slds-p-around_medium slds-text-color_error">
            Une erreur est survenue lors du chargement des voyages.
        </div>
    </template>

</lightning-card>


</template>
